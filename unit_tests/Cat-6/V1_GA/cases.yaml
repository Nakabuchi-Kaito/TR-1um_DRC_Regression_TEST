rule_id: V1.GA

layers:
  V1: { number: 19, datatype: 0 }  # ビア1
  GC: { number:  8, datatype: 1 }  # Gate Poly (GA)
  GR: { number:  8, datatype: 2 }  # Resistor Poly (GA)

allow_other_rules: false
waive_rule_ids:
  # Poly関連の構造・連鎖エラーを除外
  - GC.W1
  - GC.S1
  - GC.ANT
  - GR.W1
  - GR.S1
  - GR.L1
  - RS.SZ
  - GA.CO
  # ビア関連の構造・連鎖エラーを除外
  - V1.W1
  - V1.S1
  - V1.Z1
  - V1.Z2
  - Warning

cases:
  # ===================================================
  # パターン1（正常系・GC対向）：間隔 1.20μm (PASS)
  # ===================================================
  - name: pass_space_gc_1p20
    shapes:
      GC:
        - [0.0, 0.0, 5.0, 10.0]
      V1:
        # 5.0 + 1.20 = 6.20 (サイズ 1.4 x 1.4)
        - [6.20, 0.0, 7.60, 1.4]
    expected_violations: 0

  # ===================================================
  # パターン2（正常系・GR対向）：間隔 1.20μm (PASS)
  # ===================================================
  - name: pass_space_gr_1p20
    shapes:
      GR:
        - [0.0, 0.0, 5.0, 10.0]
      V1:
        - [6.20, 0.0, 7.60, 1.4]
    expected_violations: 0

  # ===================================================
  # パターン3（異常系・GC対向）：間隔 1.15μm (FAIL)
  # ===================================================
  - name: fail_space_gc_1p15_single
    shapes:
      GC:
        - [0.0, 0.0, 5.0, 10.0]
      V1:
        # 5.0 + 1.15 = 6.15 (0.05不足)
        - [6.15, 0.0, 7.55, 1.4]
    expected_violations: 1

  # ===================================================
  # パターン4（異常系・GR対向）：間隔 1.15μm (FAIL)
  # ===================================================
  - name: fail_space_gr_1p15_single
    shapes:
      GR:
        - [0.0, 0.0, 5.0, 10.0]
      V1:
        - [6.15, 0.0, 7.55, 1.4]
    expected_violations: 1

  # ===================================================
  # パターン5（異常系・GC対向）：間隔 1.15μm が2箇所 (FAIL)
  # ===================================================
  - name: fail_space_gc_1p15_double
    shapes:
      GC:
        - [0.0, 0.0, 5.0, 10.0]
      V1:
        # 1箇所目 (Y: 0.0〜1.4)
        - [6.15, 0.0, 7.55, 1.4]
        # 2箇所目 (Y: 5.0〜6.4)
        - [6.15, 5.0, 7.55, 6.4]
    expected_violations: 2