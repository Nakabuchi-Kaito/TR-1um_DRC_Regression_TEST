rule_id: M1.CL

layers:
  AR: { number:  3, datatype: 3 }  # 抵抗 Active (CO(L) 認識用)
  GC: { number:  8, datatype: 1 }  # 下地 Poly
  CO: { number: 11, datatype: 0 }  # 大面積コンタクト (2.0 x 2.0)
  M1: { number: 13, datatype: 0 }  # M1 配線

allow_other_rules: false
waive_rule_ids:
  - AR.GC
  - AR.L1
  - AR.XY
  - CL.GC
  - CR.AT
  - GC.ANT
  - GC.R1
  - GC.R2
  - Warning
  - "[EXT] Invalid RR. Check CO enclosure."

cases:
  # ===================================================
  # パターン1（正常系）：全周マージン 1.20μm (PASS)
  # ===================================================
  - name: pass_enclose_1p2
    shapes:
      AR:
        - [5.0, 5.0, 17.0, 17.0]
      GC:
        - [4.0, 4.0, 18.0, 18.0]
      CO:
        - [10.0, 10.0, 12.0, 12.0]
      M1:
        # 10.0 - 1.2 = 8.8, 12.0 + 1.2 = 13.2
        - [8.8, 8.8, 13.2, 13.2]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系）：全周マージン 1.15μm (FAIL: 4辺違反)
  # ===================================================
  - name: fail_enclose_1p15_all
    shapes:
      AR:
        - [5.0, 5.0, 17.0, 17.0]
      GC:
        - [4.0, 4.0, 18.0, 18.0]
      CO:
        - [10.0, 10.0, 12.0, 12.0]
      M1:
        # 全周 0.05 不足 (10.0 - 1.15 = 8.85, 12.0 + 1.15 = 13.15)
        - [8.85, 8.85, 13.15, 13.15]
    expected_violations: 4

  # ===================================================
  # パターン3（異常系）：左辺のみマージン 1.15μm (FAIL: 1辺違反)
  # ===================================================
  - name: fail_enclose_1p15_single
    shapes:
      AR:
        - [5.0, 5.0, 17.0, 17.0]
      GC:
        - [4.0, 4.0, 18.0, 18.0]
      CO:
        - [10.0, 10.0, 12.0, 12.0]
      M1:
        # Xmin のみ 1.15 (8.85)、他辺は 1.20
        - [8.85, 8.8, 13.2, 13.2]
    expected_violations: 1