  # パターン1（正常系）：間隔 5.00μm (PASS)
  # ===================================================
  - name: pass_space_5p0
    shapes:
      TEMP:
        - [-30.0, -30.0, 90.0,   0.0]
        - [-30.0,  60.0, 90.0,  90.0]
        - [-30.0,   0.0,  0.0,  60.0]
        - [ 60.0,   0.0, 90.0,  60.0]
      M2:
        # 上側横帯 M2S
        - [-10.0, 65.0, 70.0, 75.0]
        # 下側縦配線 M2 (上端 Y=60.0)
        - [25.0, 20.0, 35.0, 60.0]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系）：間隔 4.95μm (FAIL: 1件)
  # ===================================================
  - name: fail_space_4p95_single
    shapes:
      TEMP:
        - [-30.0, -30.0, 90.0,   0.0]
        - [-30.0,  60.0, 90.0,  90.0]
        - [-30.0,   0.0,  0.0,  60.0]
        - [ 60.0,   0.0, 90.0,  60.0]
      M2:
        - [-10.0, 65.0, 70.0, 75.0]
        - [25.0, 20.0, 35.0, 60.05]
    expected_violations: 1

  # ===================================================
  # パターン3（異常系）：間隔 4.95μm が2箇所 (FAIL: 2件)
  # ===================================================
  - name: fail_space_4p95_double
    shapes:
      TEMP:
        - [-30.0, -30.0, 90.0,   0.0]
        - [-30.0,  60.0, 90.0,  90.0]
        - [-30.0,   0.0,  0.0,  60.0]
        - [ 60.0,   0.0, 90.0,  60.0]
      M2:
        - [-10.0, 65.0, 70.0, 75.0]
        - [10.0, 20.0, 20.0, 60.05]
        - [40.0, 20.0, 50.0, 60.05]
    expected_violations: 2