rule_id: M1.SCR

layers:
  TEMP: { number: 80, datatype: 0 }  # チップ外周枠
  M1:   { number: 13, datatype: 0 }  # M1配線 (枠外=M1S, 枠内=M1)

allow_other_rules: false
waive_rule_ids:
  - M1.W1
  - M1.W3
  - M1.S1
  - M1.SW
  - ER1402
  - ER1903
  - Warning

cases:
  # ===================================================
  # パターン1（正常系）：間隔 5.00μm (PASS)
  # 上: 横帯 M1(S) / 下: 縦配線 M1
  # ===================================================
  - name: pass_space_5p0
    shapes:
      # --- チップ開口枠 TEMP (Y: 0〜60 がチップ内部) ---
      TEMP:
        - [-30.0, -30.0, 90.0,   0.0]  # 下枠
        - [-30.0,  60.0, 90.0,  90.0]  # 上枠 (境界線: Y=60.0)
        - [-30.0,   0.0,  0.0,  60.0]  # 左枠
        - [ 60.0,   0.0, 90.0,  60.0]  # 右枠
      M1:
        # 上側: スクライブライン領域 (M1S) 横帯バー
        - [-10.0, 65.0, 70.0, 75.0]
        # 下側: チップ内部領域 (通常M1) 縦配線 (上端 Y=60.0、間隔: 65.0 - 60.0 = 5.00)
        - [25.0, 20.0, 35.0, 60.0]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系）：間隔 4.95μm (0.05不足で FAIL: 1件)
  # ===================================================
  - name: fail_space_4p95_single
    shapes:
      TEMP:
        - [-30.0, -30.0, 90.0,   0.0]
        - [-30.0,  60.0, 90.0,  90.0]
        - [-30.0,   0.0,  0.0,  60.0]
        - [ 60.0,   0.0, 90.0,  60.0]
      M1:
        # 横帯バー M1S
        - [-10.0, 65.0, 70.0, 75.0]
        # 縦配線 M1: 上端 Y=60.05 (間隔: 65.0 - 60.05 = 4.95)
        - [25.0, 20.0, 35.0, 60.05]
    expected_violations: 1

  # ===================================================
  # パターン3（異常系）：間隔 4.95μm の縦配線が2本 (FAIL: 2件)
  # ===================================================
  - name: fail_space_4p95_double
    shapes:
      TEMP:
        - [-30.0, -30.0, 90.0,   0.0]
        - [-30.0,  60.0, 90.0,  90.0]
        - [-30.0,   0.0,  0.0,  60.0]
        - [ 60.0,   0.0, 90.0,  60.0]
      M1:
        # 横帯バー M1S
        - [-10.0, 65.0, 70.0, 75.0]
        # 縦配線 1本目 (左側)
        - [10.0, 20.0, 20.0, 60.05]
        # 縦配線 2本目 (右側)
        - [40.0, 20.0, 50.0, 60.05]
    expected_violations: 2