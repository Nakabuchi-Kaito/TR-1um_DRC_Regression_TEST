rule_id: M1.CC

layers:
  AC: { number:  3, datatype: 4 }  # キャパシタ Active
  CO: { number: 11, datatype: 0 }  # コンタクト (CO(CC), CO(C))
  M1: { number: 13, datatype: 0 }  # コ型 M1(C) および中央引き出し配線・プレート

allow_other_rules: false
waive_rule_ids:
  - AC.AN
  - AC.GC
  - AC.R1
  - AC.S1
  - AC.W1
  - AC.WC
  - CC.W1
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - GA.CO
  - GC.ANT
  - M1.W1
  - M1.S1
  - M1.SW
  - M1.W3
  - M1.SC
  - M1.CO
  - M1.CL
  - ERCSIO06
  - ERCSIO16
  - Warning

cases:
  # ===================================================
  # パターン1（正常系）：CO(CC) の右辺マージン 1.30μm (PASS)
  # ===================================================
  - name: pass_enclose_1p30
    shapes:
      # --- コ型 M1(C) リング ＋ 中央引き出し配線 ＋ M1 プレート ---
      M1:
        - [0.0,   0.0, 60.0, 10.0]     # 下腕
        - [0.0,  50.0, 60.0, 60.0]     # 上腕
        - [50.0,  0.0, 60.0, 60.0]     # 右腕
        - [0.0,   0.0, 10.0, 25.0]     # 左腕 (下部)
        - [0.0,  35.0, 10.0, 60.0]     # 左腕 (上部: 開口幅 10.0μm)
        - [-5.0, 27.5, 20.0, 32.5]     # スリットを通る引き出し配線
        - [20.0, 18.0, 42.0, 42.0]     # 中央 M1 プレート (右端: X=42.0)
      # --- 中央キャパシタ AC ---
      AC:
        - [16.0, 14.0, 46.0, 46.0]
      # --- コンタクト群 ---
      CO:
        # 中央プレート上の CO(CC): 右端 X=42.0 に対しマージン 42.0 - 40.70 = 1.30μm
        - [39.50, 29.40, 40.70, 30.60]
        # 右腕外周の CO(C): M1.CO は余裕を持ってクリア (マージン 4.0μm)
        - [54.80, 29.40, 56.00, 30.60]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系）：CO(CC) の右辺マージン 1.25μm (0.05不足で FAIL: 1件)
  # ===================================================
  - name: fail_enclose_1p25_single
    shapes:
      M1:
        - [0.0,   0.0, 60.0, 10.0]
        - [0.0,  50.0, 60.0, 60.0]
        - [50.0,  0.0, 60.0, 60.0]
        - [0.0,   0.0, 10.0, 25.0]
        - [0.0,  35.0, 10.0, 60.0]
        - [-5.0, 27.5, 20.0, 32.5]
        - [20.0, 18.0, 42.0, 42.0]
      AC:
        - [16.0, 14.0, 46.0, 46.0]
      CO:
        # 右端 X=42.0 に対しマージン 42.0 - 40.75 = 1.25μm (右辺1箇所のみ違反)
        - [39.55, 29.40, 40.75, 30.60]
        - [54.80, 29.40, 56.00, 30.60]
    expected_violations: 1

  # ===================================================
  # パターン3（異常系）：右辺マージン 1.25μm の CO(CC) が2箇所 (FAIL: 2件)
  # ===================================================
  - name: fail_enclose_1p25_double
    shapes:
      M1:
        - [0.0,   0.0, 60.0, 10.0]
        - [0.0,  50.0, 60.0, 60.0]
        - [50.0,  0.0, 60.0, 60.0]
        - [0.0,   0.0, 10.0, 25.0]
        - [0.0,  35.0, 10.0, 60.0]
        - [-5.0, 27.5, 20.0, 32.5]
        - [20.0, 18.0, 42.0, 42.0]
      AC:
        - [16.0, 14.0, 46.0, 46.0]
      CO:
        # 中央プレート CO(CC) 1個目 (下側: マージン 1.25μm)
        - [39.55, 22.00, 40.75, 23.20]
        # 中央プレート CO(CC) 2個目 (上側: マージン 1.25μm)
        - [39.55, 36.80, 40.75, 38.00]
        # 右腕外周の CO(C)
        - [54.80, 29.40, 56.00, 30.60]
    expected_violations: 2