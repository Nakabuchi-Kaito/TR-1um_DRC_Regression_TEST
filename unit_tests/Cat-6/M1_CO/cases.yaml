rule_id: M1.CO

layers:
  GC: { number:  8, datatype: 1 }  # CO下地（CO.Z1回避用）
  CO: { number: 11, datatype: 0 }  # コンタクト (1.0 x 1.0)
  M1: { number: 13, datatype: 0 }  # M1 配線

allow_other_rules: false
waive_rule_ids:
  - CO.Z1
  - GC.W1
  - GC.ANT
  - Warning

cases:
  # ===================================================
  # パターン1（正常系）：全周マージン 0.80μm (PASS)
  # ===================================================
  - name: pass_enclose_0p8
    shapes:
      GC:
        - [5.0, 5.0, 16.0, 16.0]
      CO:
        - [10.0, 10.0, 11.0, 11.0]
      M1:
        # 10.0 - 0.8 = 9.2, 11.0 + 0.8 = 11.8
        - [9.2, 9.2, 11.8, 11.8]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系）：全周マージン 0.75μm (FAIL: 4辺違反)
  # ===================================================
  - name: fail_enclose_0p75_all
    shapes:
      GC:
        - [5.0, 5.0, 16.0, 16.0]
      CO:
        - [10.0, 10.0, 11.0, 11.0]
      M1:
        # 全周 0.05 不足 (10.0 - 0.75 = 9.25, 11.0 + 0.75 = 11.75)
        - [9.25, 9.25, 11.75, 11.75]
    expected_violations: 4

  # ===================================================
  # パターン3（異常系）：下辺のみマージン 0.75μm (FAIL: 1辺違反)
  # ===================================================
  - name: fail_enclose_0p75_single
    shapes:
      GC:
        - [5.0, 5.0, 16.0, 16.0]
      CO:
        - [10.0, 10.0, 11.0, 11.0]
      M1:
        # Ymin のみ 0.75 (9.25)、他辺は 0.80 (X: 9.2〜11.8, Ymax: 11.8)
        - [9.2, 9.25, 11.8, 11.8]
    expected_violations: 1