rule_id: M1.SW

layers:
  M1: { number: 13, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - M1.W1
  - M1.W3
  - M1.S1
  - ER1402
  - ER1903
  - Warning

cases:
  # ===================================================
  # パターン1（正常系）：間隔 2.00μm (PASS)
  # ===================================================
  - name: pass_space_2p00
    shapes:
      M1:
        - [0.0, 0.0, 50.0, 50.0]        # Wide M1 (50x50)
        - [52.0, 0.0, 54.0, 50.0]       # 通常M1 (間隔: 52.0 - 50.0 = 2.00)
    expected_violations: 0

  # ===================================================
  # パターン2（異常系・不足）：間隔 1.95μm (FAIL: 境界値 -0.05)
  # ===================================================
  - name: fail_space_1p95_single
    shapes:
      M1:
        - [0.0, 0.0, 50.0, 50.0]        # Wide M1
        - [51.95, 0.0, 53.95, 50.0]     # 間隔: 51.95 - 50.0 = 1.95
    expected_violations: 1

  # ===================================================
  # パターン3（異常系・不足）：間隔 1.95μm が2箇所 (FAIL)
  # ===================================================
  - name: fail_space_1p95_double
    shapes:
      M1:
        - [0.0, 0.0, 50.0, 50.0]        # 中央 Wide M1
        - [-3.95, 0.0, -1.95, 50.0]     # 左側通常M1 (間隔: 1.95)
        - [51.95, 0.0, 53.95, 50.0]     # 右側通常M1 (間隔: 1.95)
    expected_violations: 2