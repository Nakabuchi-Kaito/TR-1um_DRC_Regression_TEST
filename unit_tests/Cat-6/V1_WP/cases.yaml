rule_id: V1.WP

layers:
  PO: { number: 14, datatype: 0 }  # Pad開口下地
  V1: { number: 19, datatype: 0 }  # Pad上ビア

allow_other_rules: false
waive_rule_ids:
  # 下地POおよびビアの構造・連鎖エラーを除外
  - PO.W1
  - PO.S1
  - PO.Z1
  - PO.Z2
  - PO.Z3
  - PP.W1
  - PP.S1
  - V1.W1
  - V1.S1
  - V1.Z1
  - V1.Z2
  - Warning

cases:
  # ===================================================
  # パターン1（正常系）：幅 60.00μm (PASS)
  # ===================================================
  - name: pass_width_60p0
    shapes:
      PO:
        - [-10.0, -10.0, 90.0, 90.0]
      V1:
        # 60.0 x 60.0 (幅 60.00)
        - [10.0, 10.0, 70.0, 70.0]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系）：幅 59.95μm (0.05不足で FAIL)
  # ===================================================
  - name: fail_width_59p95_single
    shapes:
      PO:
        - [-10.0, -10.0, 90.0, 90.0]
      V1:
        # 59.95 x 60.0 (幅不足)
        - [10.0, 10.0, 69.95, 70.0]
    expected_violations: 1

  # ===================================================
  # パターン3（異常系）：幅 59.95μm が2箇所 (FAIL)
  # ===================================================
  - name: fail_width_59p95_double
    shapes:
      PO:
        - [-10.0, -10.0, 90.0, 200.0]
      V1:
        # 1個目 (Y: 10〜70)
        - [10.0, 10.0, 69.95, 70.0]
        # 2個目 (Y: 110〜170)
        - [10.0, 110.0, 69.95, 170.0]
    expected_violations: 2