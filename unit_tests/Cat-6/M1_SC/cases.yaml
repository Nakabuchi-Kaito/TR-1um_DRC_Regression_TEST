rule_id: M1.SC

layers:
  WN: { number: 140, datatype: 0 }  # CSIO認識用ウェル
  AC: { number:   3, datatype: 4 }  # キャパシタ電極
  AN: { number:   3, datatype: 2 }  # ガードリング下地アクティブ
  M1: { number:  13, datatype: 0 }  # M1リング
  CO: { number:  11, datatype: 0 }  # M1C抽出用トリガーコンタクト

allow_other_rules: false
waive_rule_ids:
  - AC.AN
  - AC.GC
  - AC.R1
  - AC.S1
  - AC.W1
  - AC.WC
  - AN.S1
  - AN.W1
  - AN.WC
  - AN.WN
  - CC.W1
  - CO.AN
  - CO.S1
  - CO.SC
  - CO.W1
  - CO.Z1
  - CO.Z3
  - GA.CO
  - GC.ANT
  - M1.CC
  - M1.CL
  - M1.CO
  - M1.S1
  - M1.SW
  - M1.W1
  - WN.AC
  - WN.S1
  - WN.W1
  - Warning
  - ERCSIO06
  - ERCSIO16

cases:
  # ===================================================
  # パターン1（正常系）：リング開口ギャップ 10.00μm (PASS)
  # ===================================================
  - name: pass_gap_10p0
    shapes:
      WN:
        - [-10.0, -10.0, 50.0, 50.0]
      AC:
        - [10.0, 10.0, 30.0, 30.0]
      AN:
        - [0.0,  0.0, 40.0,  5.0]       # 下辺
        - [0.0, 35.0, 40.0, 40.0]       # 上辺
        - [35.0, 5.0, 40.0, 35.0]       # 右辺
        - [0.0,  5.0,  5.0, 35.0]       # 左辺 (閉じたリング)
      M1:
        - [0.0,  0.0, 40.0,  5.0]       # 下辺
        - [0.0, 35.0, 40.0, 40.0]       # 上辺
        - [35.0, 5.0, 40.0, 35.0]       # 右辺
        - [0.0,  5.0,  5.0, 15.0]       # 左辺下側
        - [0.0, 25.0,  5.0, 35.0]       # 左辺上側 (ギャップ: 25.0 - 15.0 = 10.00)
      CO:
        - [36.9, 19.4, 38.1, 20.6]      # 右辺M1上のコンタクト (1.2x1.2)
    expected_violations: 0

  # ===================================================
  # パターン2（異常系・不足）：リング開口ギャップ 9.95μm (FAIL)
  # ===================================================
  - name: fail_gap_9p95_single
    shapes:
      WN:
        - [-10.0, -10.0, 50.0, 50.0]
      AC:
        - [10.0, 10.0, 30.0, 30.0]
      AN:
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 35.0]
      M1:
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 15.0]
        - [0.0, 24.95, 5.0, 35.0]       # ギャップ: 24.95 - 15.0 = 9.95
      CO:
        - [36.9, 19.4, 38.1, 20.6]
    expected_violations: 1

  # ===================================================
  # パターン3（異常系・不足）：ギャップ 9.95μm が2リング (FAIL)
  # ===================================================
  - name: fail_gap_9p95_double
    shapes:
      WN:
        - [-10.0, -10.0, 50.0, 120.0]
      AC:
        - [10.0, 10.0, 30.0, 30.0]      # 1組目 (Y: 0〜40)
        - [10.0, 70.0, 30.0, 90.0]      # 2組目 (Y: 60〜100)
      AN:
        # リング1
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 35.0]
        # リング2
        - [0.0, 60.0, 40.0, 65.0]
        - [0.0, 95.0, 40.0, 100.0]
        - [35.0, 65.0, 40.0, 95.0]
        - [0.0, 65.0,  5.0, 95.0]
      M1:
        # リング1
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 15.0]
        - [0.0, 24.95, 5.0, 35.0]
        # リング2
        - [0.0, 60.0, 40.0, 65.0]
        - [0.0, 95.0, 40.0, 100.0]
        - [35.0, 65.0, 40.0, 95.0]
        - [0.0, 65.0,  5.0, 75.0]
        - [0.0, 84.95, 5.0, 95.0]
      CO:
        - [36.9, 19.4, 38.1, 20.6]
        - [36.9, 79.4, 38.1, 80.6]
    expected_violations: 2

  # ===================================================
  # パターン4（異常系・超過）：リング開口ギャップ 10.05μm (FAIL)
  # ===================================================
  - name: fail_gap_10p05_single
    shapes:
      WN:
        - [-10.0, -10.0, 50.0, 50.0]
      AC:
        - [10.0, 10.0, 30.0, 30.0]
      AN:
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 35.0]
      M1:
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 15.0]
        - [0.0, 25.05, 5.0, 35.0]       # ギャップ: 25.05 - 15.0 = 10.05
      CO:
        - [36.9, 19.4, 38.1, 20.6]
    expected_violations: 1

  # ===================================================
  # パターン5（異常系・超過）：ギャップ 10.05μm が2リング (FAIL)
  # ===================================================
  - name: fail_gap_10p05_double
    shapes:
      WN:
        - [-10.0, -10.0, 50.0, 120.0]
      AC:
        - [10.0, 10.0, 30.0, 30.0]
        - [10.0, 70.0, 30.0, 90.0]
      AN:
        # リング1
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 35.0]
        # リング2
        - [0.0, 60.0, 40.0, 65.0]
        - [0.0, 95.0, 40.0, 100.0]
        - [35.0, 65.0, 40.0, 95.0]
        - [0.0, 65.0,  5.0, 95.0]
      M1:
        # リング1
        - [0.0,  0.0, 40.0,  5.0]
        - [0.0, 35.0, 40.0, 40.0]
        - [35.0, 5.0, 40.0, 35.0]
        - [0.0,  5.0,  5.0, 15.0]
        - [0.0, 25.05, 5.0, 35.0]
        # リング2
        - [0.0, 60.0, 40.0, 65.0]
        - [0.0, 95.0, 40.0, 100.0]
        - [35.0, 65.0, 40.0, 95.0]
        - [0.0, 65.0,  5.0, 75.0]
        - [0.0, 85.05, 5.0, 95.0]
      CO:
        - [36.9, 19.4, 38.1, 20.6]
        - [36.9, 79.4, 38.1, 80.6]
    expected_violations: 2