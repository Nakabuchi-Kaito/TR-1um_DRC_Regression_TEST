  - name: pass_width_45p0
    shapes:
      M2:
        - [0.0, 0.0, 45.0, 50.0]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系）：幅 45.05μm (0.05超過で FAIL)
  # ===================================================
