    shapes:
      M2:
        - [0.0, 0.0, 45.05, 50.0]
    expected_violations: 1

  # ===================================================
  # パターン3（異常系）：幅 45.05μm が2箇所 (FAIL)
  # ===================================================
  - name: fail_width_45p05_double
    shapes:
      M2:
        - [0.0, 0.0, 45.05, 50.0]
        - [60.0, 0.0, 105.05, 50.0]
    expected_violations: 2