rule_id: V1.W1

layers:
  V1: { number: 19, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - V1.M1
  - V1.M2
  - V1.S1
  - V1.Z1
  - V1.Z2
  - Warning

cases:
  # ===================================================
  # パターン1（正常系）：正方形 1.40 x 1.40μm (PASS)
  # ===================================================
  - name: pass_width_1p40
    shapes:
      V1:
        - [0.0, 0.0, 1.4, 1.4]
    expected_violations: 0

  # ===================================================
  # パターン2（異常系・縮小）：1.35 x 1.40μm (FAIL: 長方形)
  # Wfix(1件) + bbox_min(1件) = 2件発火
  # ===================================================
  - name: fail_width_1p35_rect
    shapes:
      V1:
        - [0.0, 0.0, 1.35, 1.4]
    expected_violations: 2

  # ===================================================
  # パターン3（異常系・縮小）：1.35 x 1.35μm (FAIL: 正方形)
  # Wfix左右2エッジ(2件) + bbox_min(1件) = 3件発火
  # ===================================================
  - name: fail_width_1p35_square
    shapes:
      V1:
        - [0.0, 0.0, 1.35, 1.35]
    expected_violations: 3

  # ===================================================
  # パターン4（異常系・超過）：1.45 x 1.40μm (FAIL: 長方形)
  # bbox_max による 1件発火
  # ===================================================
  - name: fail_width_1p45_rect
    shapes:
      V1:
        - [0.0, 0.0, 1.45, 1.4]
    expected_violations: 1

  # ===================================================
  # パターン5（異常系・超過）：1.45 x 1.45μm (FAIL: 正方形)
  # bbox_max による 1件発火
  # ===================================================
  - name: fail_width_1p45_square
    shapes:
      V1:
        - [0.0, 0.0, 1.45, 1.45]
    expected_violations: 1