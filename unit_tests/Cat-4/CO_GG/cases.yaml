rule_id: CO.GG

layers:
  CO: { number: 11, datatype: 0 }
  AN: { number: 3, datatype: 2 }
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
waive_rule_ids:
  - CO.W1
  - CO.WM
  - CO.S1
  - CO.SM
  - CO.Z1
  - CO.Z3
  - CO.AN
  - CO.GC
  - GC.W1
  - GC.S1
  - GC.EN
  - GC.ANT
  - GA.CO
  - AN.W1
  - AN.S1
  - AN.WM
  - AN.LM
  - DN.W1
  - DN.AN

cases:
  # ===================================================
  # 正常系：3個とも GC との間隔 1.00 固定 (PASS)
  # ===================================================
  - name: pass_space_1p0_3contacts
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]      # Y幅 7.00
      GC:
        - [2.0, -1.5, 3.0, 8.50]     # GC 右端: X=3.0
      CO:
        - [4.00, 1.00, 5.00, 2.00]   # 隙間 1.00
        - [4.00, 3.00, 5.00, 4.00]   # 隙間 1.00
        - [4.00, 5.00, 5.00, 6.00]   # 隙間 1.00
    expected_violations: 0

  # ===================================================
  # 異常系①（全体不足）：3個とも間隔 0.95 (ポリゴン3 + エッジ1 = 4)
  # ===================================================
  - name: fail_space_0p95_all_3contacts
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [3.95, 1.00, 4.95, 2.00]   # 隙間 0.95
        - [3.95, 3.00, 4.95, 4.00]   # 隙間 0.95
        - [3.95, 5.00, 4.95, 6.00]   # 隙間 0.95
    expected_violations: 4

  # ===================================================
  # 異常系②（全体超過）：3個とも間隔 1.05 (エッジのみ = 1)
  # ===================================================
  - name: fail_space_1p05_all_3contacts
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [4.05, 1.00, 5.05, 2.00]   # 隙間 1.05
        - [4.05, 3.00, 5.05, 4.00]   # 隙間 1.05
        - [4.05, 5.00, 5.05, 6.00]   # 隙間 1.05
    expected_violations: 1

  # ===================================================
  # 異常系③（中央のみ不足）：中央だけ 0.95 (ポリゴン1 + エッジ1 = 2)
  # ===================================================
  - name: fail_space_0p95_middle_only
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [4.00, 1.00, 5.00, 2.00]   # 隙間 1.00
        - [3.95, 3.00, 4.95, 4.00]   # 隙間 0.95
        - [4.00, 5.00, 5.00, 6.00]   # 隙間 1.00
    expected_violations: 2

  # ===================================================
  # 異常系④（中央のみ超過）：中央だけ 1.05 (エッジのみ = 1)
  # ===================================================
  - name: fail_space_1p05_middle_only
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [4.00, 1.00, 5.00, 2.00]   # 隙間 1.00
        - [4.05, 3.00, 5.05, 4.00]   # 隙間 1.05
        - [4.00, 5.00, 5.00, 6.00]   # 隙間 1.00
    expected_violations: 1

  # ===================================================
  # 異常系⑤（端部のみ不足）：下端だけ 0.95 (ポリゴン1 + エッジ1 = 2)
  # ===================================================
  - name: fail_space_0p95_edge_only
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [3.95, 1.00, 4.95, 2.00]   # 隙間 0.95
        - [4.00, 3.00, 5.00, 4.00]   # 隙間 1.00
        - [4.00, 5.00, 5.00, 6.00]   # 隙間 1.00
    expected_violations: 2

  # ===================================================
  # 異常系⑥（端部のみ超過）：下端だけ 1.05 (エッジのみ = 1)
  # ===================================================
  - name: fail_space_1p05_edge_only
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [4.05, 1.00, 5.05, 2.00]   # 隙間 1.05
        - [4.00, 3.00, 5.00, 4.00]   # 隙間 1.00
        - [4.00, 5.00, 5.00, 6.00]   # 隙間 1.00
    expected_violations: 1