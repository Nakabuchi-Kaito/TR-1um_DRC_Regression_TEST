rule_id: CO.SD

layers:
  CO: { number: 11, datatype: 0 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - CO.W1
  - CO.WD
  - CO.AD
  - CO.AN
  - CO.S1
  - CO.Z3
  - AN.W1
  - AN.S1
  - DN.W1
  - DN.AN

cases:
  # 正常系：基準間隔 1.20 を確保 (PASS)
  - name: pass_space_1p20
    shapes:
      AN:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        - [0.0, 0.0, 1.2, 1.2]     # CO(D)
        - [2.40, 0.0, 3.60, 1.2]   # CO (隙間 1.20)
    expected_violations: 0

  # 異常系：隙間 1.15 (0.05不足でFAIL) -> 違反数: 1
  - name: fail_space_1p15_single
    shapes:
      AN:
        - [-5.0, -5.0, 15.0, 15.0]
      CO:
        - [0.0, 0.0, 1.2, 1.2]
        - [2.35, 0.0, 3.55, 1.2]   # 隙間 1.15
    expected_violations: 2

  # 異常系：隙間 1.15 が2箇所 -> 違反数: 2
  - name: fail_space_1p15_double
    shapes:
      AN:
        - [-10.0, -5.0, 20.0, 15.0]
      CO:
        - [0.0, 0.0, 1.2, 1.2]
        - [2.35, 0.0, 3.55, 1.2]   # 右側 (隙間 1.15)
        - [-2.35, 0.0, -1.15, 1.2] # 左側 (隙間 1.15)
    expected_violations: 4