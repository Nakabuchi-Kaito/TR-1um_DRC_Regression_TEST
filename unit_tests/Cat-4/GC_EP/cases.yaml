rule_id: GC.EP

layers:
  GC: { number: 8, datatype: 1 }
  AP: { number: 3, datatype: 1 }

allow_other_rules: false
waive_rule_ids:
  - GC.W1
  - GC.S1
  - AP.W1
  - AP.S1
  - DP.W1
  - DP.AP
  - GA.BG
  - GA.CO
  - GC.ANT
  - GC.EN

cases:
  # ==========================================
  # 正常系：上下のエンドキャップ突出長が両方 1.20μm (PASS)
  # ==========================================
  - name: pass_endcap_1p2
    shapes:
      AP:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        # X幅 1.0 (4.5〜5.5)、Y突出: 下側 1.2 (-1.2〜0.0), 上側 1.2 (10.0〜11.2)
        - [4.5, -1.2, 5.5, 11.2]
    expected_violations: 0

  # ==========================================
  # 異常系①：上側だけ 1.15μm (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_endcap_1p15_single
    shapes:
      AP:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        # 下側 1.2 (安全圏), 上側 1.15 (10.0〜11.15)
        - [4.5, -1.2, 5.5, 11.15]
    expected_violations: 1

  # ==========================================
  # 異常系②：上下両方とも 1.15μm (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_endcap_1p15_double
    shapes:
      AP:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        # 下側 1.15 (-1.15〜0.0), 上側 1.15 (10.0〜11.15)
        - [4.5, -1.15, 5.5, 11.15]
    expected_violations: 2