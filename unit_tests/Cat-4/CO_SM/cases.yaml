rule_id: CO.SM

layers:
  CO: { number: 11, datatype: 0 }
  AN: { number: 3, datatype: 2 }
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
waive_rule_ids:
  - CO.W1
  - CO.WM
  - CO.S1
  - CO.GG
  - CO.Z1
  - CO.Z3
  - CO.AN
  - CO.GC
  - GC.W1
  - GC.S1
  - GC.EN
  - GC.ANT
  - GA.CO
  - AN.W1
  - AN.S1
  - AN.WM
  - AN.LM
  - DN.W1
  - DN.AN

cases:
  # ===================================================
  # 正常系①：2コンタクト均等配置 (PASS)
  # ===================================================
  - name: pass_space_1p0_2contacts
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 5.00]
      GC:
        - [2.0, -1.5, 3.0, 6.50]
      CO:
        - [4.00, 1.00, 5.00, 2.00]
        - [4.00, 3.00, 5.00, 4.00]
    expected_violations: 0

  # ===================================================
  # 正常系②：3コンタクト均等配置 (PASS)
  # ===================================================
  - name: pass_space_1p0_3contacts
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [4.00, 1.00, 5.00, 2.00]
        - [4.00, 3.00, 5.00, 4.00]
        - [4.00, 5.00, 5.00, 6.00]
    expected_violations: 0

  # ===================================================
  # 異常系①（間隔超過）：間隔 1.05 -> 違反数: 2
  # ===================================================
  - name: fail_space_1p05_single
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 5.05]
      GC:
        - [2.0, -1.5, 3.0, 6.55]
      CO:
        - [4.00, 1.00, 5.00, 2.00]
        - [4.00, 3.05, 5.00, 4.05]
    expected_violations: 2

  # ===================================================
  # 異常系②（間隔超過）：2箇所とも 1.05 -> 違反数: 3
  # ===================================================
  - name: fail_space_1p05_double
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.10]
      GC:
        - [2.0, -1.5, 3.0, 8.60]
      CO:
        - [4.00, 1.00, 5.00, 2.00]
        - [4.00, 3.05, 5.00, 4.05]
        - [4.00, 5.10, 5.00, 6.10]
    expected_violations: 3

  # ===================================================
  # 異常系③（間隔不足）：間隔 0.95 (仕様上は 2件発火)
  # ===================================================
  - name: fail_space_0p95_single
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 4.95]
      GC:
        - [2.0, -1.5, 3.0, 6.45]
      CO:
        - [4.00, 1.00, 5.00, 2.00]
        - [4.00, 2.95, 5.00, 3.95]
    expected_violations: 2

  # ===================================================
  # 異常系④（コンタクト欠落 missing CO）：
  # 幅7.0（3個配置可能）に対し2個配置（上端余白 3.0μm > 1.8μm） -> 違反数: 1
  # ===================================================
  - name: fail_missing_contact_upper
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 7.00]
      GC:
        - [2.0, -1.5, 3.0, 8.50]
      CO:
        - [4.00, 1.00, 5.00, 2.00]
        - [4.00, 3.00, 5.00, 4.00]
    expected_violations: 1

  # ===================================================
  # 異常系⑤（中心ズレ off-center）：
  # 幅6.00 に対し、下端 0.80 / 上端 2.20 (> 1.8μm) と偏り配置 -> 違反数: 1
  # ===================================================
  - name: fail_off_center_single
    shapes:
      AN:
        - [0.0, 0.0, 7.0, 6.00]
      GC:
        - [2.0, -1.5, 3.0, 7.50]
      CO:
        - [4.00, 0.80, 5.00, 1.80]
        - [4.00, 2.80, 5.00, 3.80]
    expected_violations: 1