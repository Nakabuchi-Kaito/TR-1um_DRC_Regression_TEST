rule_id: GC.W1

layers:
  # GCレイヤー: これまでの情報から 8番, Datatype 1
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
# 幅チェックに無関係なGCのエラー（スペースやアンテナ等）を念のため無視
waive_rule_ids:
  - GC.S1
  - GC.R1
  - GC.R2
  - GC.ANT
  - GA.CO
  

cases:
  # ==========================================
  # 正常系：幅がぴったり 1.0 (PASS)
  # ==========================================
  - name: pass_width_1p0
    shapes:
      GC: 
        # 幅 1.0, 長さ 10.0
        - [0.0, 0.0, 1.0, 10.0]
    expected_violations: 0

  # ==========================================
  # 異常系：幅が 0.95 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_width_0p95_single
    shapes:
      GC: 
        # 幅を 0.95 に縮める
        - [0.0, 0.0, 0.95, 10.0]
    expected_violations: 1

  # ==========================================
  # 異常系：幅が 0.95 の配線が2本 (FAIL) -> 違反数: 2
  # ==========================================
  - name: fail_width_0p95_double
    shapes:
      GC: 
        # 1本目
        - [0.0, 0.0, 0.95, 10.0]
        # 2本目 (GC.S1に引っかからないようX座標を離す)
        - [5.0, 0.0, 5.95, 10.0]
    expected_violations: 2