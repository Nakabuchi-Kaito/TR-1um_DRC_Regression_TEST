rule_id: GC.E2

layers:
  GC: { number: 8, datatype: 1 }
  AN: { number: 3, datatype: 2 }

allow_other_rules: false
waive_rule_ids:
  - GC.W1
  - GC.S1
  - GC.EN
  - GC.EP
  - GC.ANT
  - GA.CO
  - AN.W1
  - AN.S1
  - AN.WM
  - AN.LM
  - DN.W1
  - DN.AN

cases:
  # ===================================================
  # 正常系：左右の隙間 1.0 (<=1.2) に対し、突き出し長 2.40 (PASS)
  # ===================================================
  - name: pass_endcap_2p40
    shapes:
      AN:
        - [0.0, -5.0, 9.0, 0.0]     # MOS本体 (チャネル形成)
        - [0.0, 0.0, 3.0, 5.0]      # 左側の壁 (GCとの隙間: 1.0 <= 1.2)
        - [6.0, 0.0, 9.0, 5.0]      # 右側の壁 (GCとの隙間: 1.0 <= 1.2)
      GC:
        - [4.0, -5.0, 5.0, 2.40]    # 底面(Y=0)から上へ 2.40 突き出し
    expected_violations: 0

  # ===================================================
  # 異常系①：突き出し長 2.35 (0.05不足でFAIL) -> 違反数: 1
  # ===================================================
  - name: fail_endcap_2p35_single
    shapes:
      AN:
        - [0.0, -5.0, 9.0, 0.0]
        - [0.0, 0.0, 3.0, 5.0]
        - [6.0, 0.0, 9.0, 5.0]
      GC:
        - [4.0, -5.0, 5.0, 2.35]    # 底面(Y=0)から上へ 2.35 突き出し
    expected_violations: 1

  # ===================================================
  # 異常系②：突き出し長 2.35 が2箇所 -> 違反数: 2
  # ===================================================
  - name: fail_endcap_2p35_double
    shapes:
      AN:
        # 1つ目
        - [0.0, -5.0, 9.0, 0.0]
        - [0.0, 0.0, 3.0, 5.0]
        - [6.0, 0.0, 9.0, 5.0]
        # 2つ目
        - [15.0, -5.0, 24.0, 0.0]
        - [15.0, 0.0, 18.0, 5.0]
        - [21.0, 0.0, 24.0, 5.0]
      GC:
        - [4.0, -5.0, 5.0, 2.35]
        - [19.0, -5.0, 20.0, 2.35]
    expected_violations: 2