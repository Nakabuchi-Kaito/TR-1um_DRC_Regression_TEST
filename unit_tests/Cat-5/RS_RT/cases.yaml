rule_id: RS.RT

layers:
  GR: { number: 8, datatype: 2 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - CL.GC
  - CO.GR
  - CO.GS
  - CO.RT
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - GA.BG
  - GA.CO
  - GC.GR
  - GR.AN
  - GR.AP
  - GR.L1
  - GR.S1
  - GR.W1
  - RS.SZ
  - "[EXT] Invalid RS. Check CO spacing and enclosure."
  - "[EXT] can not extract RS if GR enclosure of merged CO > 2.0"
  - "[EXT] merged CO error. Only one merged CO per RS terminal allowed. Use minimum CO space."

cases:
  # ==========================================
  # 正常系：長方形 (PASS)
  # ==========================================
  - name: pass_rect
    shapes:
      GR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.5, 1.0, 2.5, 2.0]
        - [1.5, 28.0, 2.5, 29.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：凸型非矩形 (FAIL: 1)
  # ※ デッキ側前段処理(.rectangles)のデッドロックにより Actual: 0 となる
  # ==========================================
  - name: fail_convex_bump
    shapes:
      GR:
        - [0.0, 0.0, 4.0, 30.0]
        - [4.0, 10.0, 5.0, 20.0]
      CO:
        - [1.5, 1.0, 2.5, 2.0]
        - [1.5, 28.0, 2.5, 29.0]
    expected_violations: 1

  # ==========================================
  # 異常系②：凹型非矩形 (FAIL: 1)
  # ※ デッキ側前段処理(.rectangles)のデッドロックにより Actual: 0 となる
  # ==========================================
  - name: fail_concave_notch
    shapes:
      GR:
        - [0.0, 0.0, 4.0, 10.0]
        - [0.0, 20.0, 4.0, 30.0]
        - [0.0, 10.0, 3.0, 20.0]
      CO:
        - [1.5, 1.0, 2.5, 2.0]
        - [1.5, 28.0, 2.5, 29.0]
    expected_violations: 1