rule_id: RR.RT

layers:
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - AR.GC
  - AR.L1
  - AR.S1
  - AR.W1
  - AR.WR
  - AR.XY
  - CL.GC
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - CR.AR
  - CR.ASN
  - CR.ASW
  - CR.AT
  - CR.W1
  - CR.W2
  - CR.W3
  - GA.BG
  - GA.CO
  - GC.R1
  - RR.SZ
  - WN.S1
  - WN.W1
  - WN.Z1
  - "[EXT] Invalid RR. Check CO enclosure."
  - "[EXT] Only one CO per RR terminal allowed."
  - "[EXT] can not extract RR if AR enclosure of CO > 2.0"

cases:
  # ==========================================
  # 正常系：長方形 (PASS)
  # ==========================================
  - name: pass_rect
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 2.8, 30.0]
      CO:
        - [0.9, 1.5, 1.9, 2.5]
        - [0.9, 27.5, 1.9, 28.5]
    expected_violations: 0

  # ==========================================
  # 異常系①：凸型非矩形 (FAIL: 1)
  # ※ デッキ側前段処理(.rectangles)のデッドロックにより Actual: 0 となる
  # ==========================================
  - name: fail_convex_bump
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 2.8, 30.0]
        - [2.8, 10.0, 3.8, 20.0]
      CO:
        - [0.9, 1.5, 1.9, 2.5]
        - [0.9, 27.5, 1.9, 28.5]
    expected_violations: 1

  # ==========================================
  # 異常系②：凹型非矩形 (FAIL: 1)
  # ※ デッキ側前段処理(.rectangles)のデッドロックにより Actual: 0 となる
  # ==========================================
  - name: fail_concave_notch
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 2.8, 10.0]
        - [0.0, 20.0, 2.8, 30.0]
        - [0.0, 10.0, 1.8, 20.0]
      CO:
        - [0.9, 1.5, 1.9, 2.5]
        - [0.9, 27.5, 1.9, 28.5]
    expected_violations: 1