rule_id: CO.SC

layers:
  WN: { number: 140, datatype: 0 }
  AN: { number: 3, datatype: 2 }
  AC: { number: 3, datatype: 4 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - WN.W1
  - WN.S1
  - WN.Z1
  - AC.W1
  - AC.S1
  - AC.AN
  - AC.GC
  - AC.R1
  - AN.W1
  - AN.S1
  - CC.W1
  - CC.AC
  - CC.AN
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - GA.CO
  - GA.BG
  - CL.GC
  - Warning

cases:
  # ==========================================
  # 正常系：CO間隔 1.20 (PASS)
  # ==========================================
  - name: pass_space_1p20
    shapes:
      WN:
        - [-5.0, -5.0, 35.0, 35.0]
      AN:
        - [0.0, 0.0, 30.0, 30.0]
      AC:
        - [5.0, 5.0, 25.0, 25.0]
      CO:
        - [8.0, 8.0, 9.2, 9.2]
        - [10.4, 8.0, 11.6, 9.2]     # 隙間: 10.4 - 9.2 = 1.20
    expected_violations: 0

  # ==========================================
  # 異常系①：CO間隔 1.15 (0.05不足でFAIL) -> 左右2エッジで発火 (違反数: 2)
  # ==========================================
  - name: fail_space_1p15_single
    shapes:
      WN:
        - [-5.0, -5.0, 35.0, 35.0]
      AN:
        - [0.0, 0.0, 30.0, 30.0]
      AC:
        - [5.0, 5.0, 25.0, 25.0]
      CO:
        - [8.0, 8.0, 9.2, 9.2]
        - [10.35, 8.0, 11.55, 9.2]   # 隙間: 10.35 - 9.2 = 1.15
    expected_violations: 2

  # ==========================================
  # 異常系②：CO間隔 1.15 が2箇所 -> 4エッジで発火 (違反数: 4)
  # ==========================================
  - name: fail_space_1p15_double
    shapes:
      WN:
        - [-5.0, -5.0, 35.0, 35.0]
      AN:
        - [0.0, 0.0, 30.0, 30.0]
      AC:
        - [5.0, 5.0, 25.0, 25.0]
      CO:
        - [8.0, 8.0, 9.2, 9.2]
        - [10.35, 8.0, 11.55, 9.2]   # 1つ目の隙間 1.15 (2エッジ)
        - [12.70, 8.0, 13.90, 9.2]   # 2つ目の隙間 1.15 (2エッジ)
    expected_violations: 4