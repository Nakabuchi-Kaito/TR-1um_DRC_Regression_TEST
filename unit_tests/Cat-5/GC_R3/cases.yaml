rule_id: GC.R3

layers:
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 }
  GC: { number: 8, datatype: 1 }      # (8, 1) に修正
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - AR.GC
  - AR.L1
  - AR.PW
  - AR.S1
  - AR.W1
  - AR.WR
  - AR.XY
  - CL.GC
  - CO.GC
  - CO.GR
  - CO.GS
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - CR.AR
  - CR.ASN
  - CR.ASW
  - CR.AT
  - CR.W1
  - CR.W2
  - CR.W3
  - GA.BG
  - GA.CO
  - GC.ANT
  - GC.R1
  - GC.R2
  - GC.S1
  - GC.W1
  - RR.RT
  - RR.SZ
  - WN.S1
  - WN.W1
  - WN.Z1
  - "[EXT] Invalid RR. Check CO enclosure."
  - "[EXT] Only one CO per RR terminal allowed."
  - "[EXT] can not extract RR if AR enclosure of CO > 2.0"

cases:
  # ===================================================
  # 正常系：正常なAR抵抗 + GCガードリング (GC上にCOなし) -> PASS
  # ===================================================
  - name: pass_no_co_on_gc
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 45.0]
      AR:
        - [0.0, 0.0, 2.8, 30.0]
      GC:
        - [-3.0, -3.0, 5.8, -1.0]     # 下辺
        - [-3.0, 31.0, 5.8, 33.0]     # 上辺
        - [-3.0, -1.0, -1.0, 31.0]    # 左辺
        - [3.8, -1.0, 5.8, 31.0]      # 右辺
      CO:
        - [0.90, 1.50, 1.90, 2.50]    # 抵抗用下端CO
        - [0.90, 27.50, 1.90, 28.50]  # 抵抗用上端CO
    expected_violations: 0

  # ===================================================
  # 異常系①：下辺GC上にCOを1個配置 -> 違反数: 1
  # ===================================================
  - name: fail_co_on_gc_single
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 45.0]
      AR:
        - [0.0, 0.0, 2.8, 30.0]
      GC:
        - [-3.0, -3.0, 5.8, -1.0]
        - [-3.0, 31.0, 5.8, 33.0]
        - [-3.0, -1.0, -1.0, 31.0]
        - [3.8, -1.0, 5.8, 31.0]
      CO:
        - [0.90, 1.50, 1.90, 2.50]
        - [0.90, 27.50, 1.90, 28.50]
        - [1.00, -2.50, 2.00, -1.50]  # 【違反】下辺GC上のCO
    expected_violations: 1

  # ===================================================
  # 異常系②：上下のGC上にCOを各1個配置 -> 違反数: 2
  # ===================================================
  - name: fail_co_on_gc_double
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 45.0]
      AR:
        - [0.0, 0.0, 2.8, 30.0]
      GC:
        - [-3.0, -3.0, 5.8, -1.0]
        - [-3.0, 31.0, 5.8, 33.0]
        - [-3.0, -1.0, -1.0, 31.0]
        - [3.8, -1.0, 5.8, 31.0]
      CO:
        - [0.90, 1.50, 1.90, 2.50]
        - [0.90, 27.50, 1.90, 28.50]
        - [1.00, -2.50, 2.00, -1.50]  # 【違反】下辺GC上CO
        - [1.00, 31.50, 2.00, 32.50]  # 【違反】上辺GC上CO
    expected_violations: 2