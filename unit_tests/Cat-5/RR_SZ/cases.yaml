rule_id: RR.SZ

layers:
  AR: { number: 3, datatype: 3 }
  CO: { number: 11, datatype: 0 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - WN.W1
  - WN.S1
  - WN.Z1
  - AR.W1
  - AR.L1
  - AR.S1
  - AR.WR
  - AR.GC
  - AR.XY
  - RR.RT
  - GC.R1
  - GA.CO
  - GA.BG
  - CL.GC
  - CR.W1
  - CR.W2
  - CR.W3
  - CR.AR
  - CR.AT
  - CR.ASN
  - CR.ASW
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
