  - name: fail_width_3p5_not_allowed
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 3.5, 30.0]
      CO:
        - [1.0, 1.5, 2.5, 2.5]
        - [1.0, 27.5, 2.5, 28.5]
    expected_violations: 1