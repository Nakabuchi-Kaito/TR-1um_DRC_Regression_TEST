  - name: pass_width_20p0
    shapes:
      WN:
        - [-10.0, -10.0, 40.0, 40.0]
      AR:
        - [0.0, 0.0, 20.0, 30.0]
      CO:
        - [1.2, 1.5, 18.8, 2.5]
        - [1.2, 27.5, 18.8, 28.5]
    expected_violations: 0

  # ==========================================
  # 異常系（FAIL）：RROK 非許可幅パターン
  # ==========================================
  - name: fail_width_5p0_not_allowed
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
