cases:
  # ==========================================
  # 正常系（PASS）：RROK 規定幅 5 パターン
  # ==========================================
  - name: pass_width_2p8
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 2.8, 30.0]
      CO:
        - [0.9, 1.5, 1.9, 2.5]
        - [0.9, 27.5, 1.9, 28.5]
    expected_violations: 0

  - name: pass_width_4p0
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.2, 1.5, 2.8, 2.5]
        - [1.2, 27.5, 2.8, 28.5]
    expected_violations: 0

  - name: pass_width_6p0
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 6.0, 30.0]
      CO:
        - [1.2, 1.5, 4.8, 2.5]
        - [1.2, 27.5, 4.8, 28.5]
    expected_violations: 0

  - name: pass_width_12p0
    shapes:
      WN:
        - [-10.0, -10.0, 30.0, 40.0]
      AR:
        - [0.0, 0.0, 12.0, 30.0]
      CO:
        - [1.2, 1.5, 10.8, 2.5]
        - [1.2, 27.5, 10.8, 28.5]
