rule_id: AR.GC

layers:
  AR: { number: 3, datatype: 3 }
  GC: { number: 8, datatype: 1 }

allow_other_rules: false
waive_rule_ids:
  - AR.L1
  - AR.PW
  - AR.S1
  - AR.W1
  - AR.WR
  - AR.XY
  - GA.BG
  - GA.CO
  - GC.ANT
  - GC.R1
  - GC.R2
  - GC.S1
  - GC.W1
  - RR.SZ
  - RR.RT
  - WN.AN
  - WN.AP
  - WN.S1
  - WN.W1
  - WN.Z1

cases:
  # ===================================================
  # 正常系：全周囲スペース 1.00 固定 (PASS) -> 違反数: 0
  # ===================================================
  - name: pass_space_1p00
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        - [-3.0, -3.0, 13.0, -1.0]     # 下辺 (隙間 1.00)
        - [-3.0, 11.0, 13.0, 13.0]     # 上辺 (隙間 1.00)
        - [-3.0, -1.0, -1.0, 11.0]     # 左辺 (隙間 1.00)
        - [11.0, -1.0, 13.0, 11.0]     # 右辺 (隙間 1.00)
    expected_violations: 0

  # ===================================================
  # 異常系①：下辺のみ 0.95 (0.05不足・単一辺) -> 違反数: 1
  # ===================================================
  - name: fail_space_0p95_single
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        - [-3.0, -3.0, 13.0, -0.95]    # 下辺のみ隙間 0.95
        - [-3.0, 11.0, 13.0, 13.0]
        - [-3.0, -1.0, -1.0, 11.0]
        - [11.0, -1.0, 13.0, 11.0]
    expected_violations: 1

  # ===================================================
  # 異常系②：全4辺すべて 0.95 (0.05不足・全周) -> 違反数: 4
  # ===================================================
  - name: fail_space_0p95_all
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        - [-3.0, -3.0, 13.0, -0.95]
        - [-3.0, 10.95, 13.0, 13.0]
        - [-3.0, -0.95, -0.95, 10.95]
        - [10.95, -0.95, 13.0, 10.95]
    expected_violations: 4

  # ===================================================
  # 異常系③：下辺のみ 1.05 (0.05超過・単一辺) -> 違反数: 1
  # ===================================================
  - name: fail_space_1p05_single
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        - [-3.0, -3.0, 13.0, -1.05]    # 下辺のみ隙間 1.05
        - [-3.0, 11.0, 13.0, 13.0]
        - [-3.0, -1.0, -1.0, 11.0]
        - [11.0, -1.0, 13.0, 11.0]
    expected_violations: 1

  # ===================================================
  # 異常系④：全4辺すべて 1.05 (0.05超過・全周) -> 違反数: 4
  # ===================================================
  - name: fail_space_1p05_all
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
      GC:
        - [-3.0, -3.0, 13.0, -1.05]
        - [-3.0, 11.05, 13.0, 13.0]
        - [-3.0, -1.05, -1.05, 11.05]
        - [11.05, -1.05, 13.0, 11.05]
    expected_violations: 4