rule_id: CR.W2

layers:
  WN: { number: 140, datatype: 0 }
  AR: { number: 3, datatype: 3 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - AR.GC
  - AR.L1
  - AR.S1
  - AR.W1
  - AR.WR
  - AR.XY
  - CL.GC
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - CR.AR
  - CR.ASN
  - CR.ASW
  - CR.AT
  - CR.W1
  - CR.W3
  - GA.BG
  - GA.CO
  - GC.R1
  - RR.RT
  - RR.SZ
  - WN.S1
  - WN.W1
  - WN.Z1
  - "[EXT] Invalid RR. Check CO enclosure."
  - "[EXT] Only one CO per RR terminal allowed."
  - "[EXT] can not extract RR if AR enclosure of CO > 2.0"

cases:
  # ==========================================
  # 正常系①：下限値 1.60 (PASS)
  # ==========================================
  - name: pass_lmin_1p60
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 45.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.2, 1.5, 2.8, 2.5]
        - [1.2, 27.5, 2.8, 28.5]
    expected_violations: 0

  # ==========================================
  # 正常系②：上限値 17.60 (PASS)
  # ==========================================
  - name: pass_lmax_17p60
    shapes:
      WN:
        - [-10.0, -10.0, 30.0, 45.0]
      AR:
        - [0.0, 0.0, 20.0, 30.0]
      CO:
        - [1.2, 1.5, 18.8, 2.5]        # 長さ: 18.8 - 1.2 = 17.60
        - [1.2, 27.5, 18.8, 28.5]
    expected_violations: 0

  # ==========================================
  # 異常系①：下限 0.05 不足 (1.55, 1箇所) -> 違反数: 1
  # ==========================================
  - name: fail_lmin_1p55_single
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 45.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.2, 1.5, 2.75, 2.5]       # 長さ: 1.55
        - [1.2, 27.5, 2.8, 28.5]
    expected_violations: 1

  # ==========================================
  # 異常系②：下限 0.05 不足 (1.55, 2箇所) -> 違反数: 2
  # ==========================================
  - name: fail_lmin_1p55_double
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 45.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.2, 1.5, 2.75, 2.5]
        - [1.2, 27.5, 2.75, 28.5]
    expected_violations: 2

  # ==========================================
  # 異常系③：上限 0.05 超過 (17.65, 1箇所) -> 違反数: 1
  # ==========================================
  - name: fail_lmax_17p65_single
    shapes:
      WN:
        - [-10.0, -10.0, 30.0, 45.0]
      AR:
        - [0.0, 0.0, 20.0, 30.0]      # AR幅は 20.0 を維持して RRW を成立させる
      CO:
        - [1.2, 1.5, 18.85, 2.5]      # 長さ: 18.85 - 1.2 = 17.65 (> 17.6)
        - [1.2, 27.5, 18.8, 28.5]     # 正常端子 (17.60)
    expected_violations: 1

  # ==========================================
  # 異常系④：上限 0.05 超過 (17.65, 2箇所) -> 違反数: 2
  # ==========================================
  - name: fail_lmax_17p65_double
    shapes:
      WN:
        - [-10.0, -10.0, 30.0, 45.0]
      AR:
        - [0.0, 0.0, 20.0, 30.0]
      CO:
        - [1.2, 1.5, 18.85, 2.5]      # 下端: 長さ 17.65
        - [1.2, 27.5, 18.85, 28.5]    # 上端: 長さ 17.65
    expected_violations: 2