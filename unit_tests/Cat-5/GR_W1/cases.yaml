rule_id: GR.W1

layers:
  GR: { number: 8, datatype: 2 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - CL.GC
  - CO.GC
  - CO.GR
  - CO.GS
  - CO.RT
  - CO.S1
  - CO.W1
  - CO.Z1
  - CO.Z3
  - GA.BG
  - GA.CO
  - GC.ANT
  - GC.GR
  - GC.R1
  - GC.R2
  - GC.S1
  - GC.W1
  - GR.AN
  - GR.AP
  - GR.L1
  - GR.S1
  - M1.CL
  - M1.S1
  - M1.W1
  - RS.RT
  - RS.SZ
  - "[EXT] Invalid RS. Check CO spacing and enclosure."
  - "[EXT] can not extract RS if GR enclosure of merged CO > 2.0"
  - "[EXT] merged CO error. Only one merged CO per RS terminal allowed. Use minimum CO space."

cases:
  # ==========================================
  # 正常系：幅 10.0 (PASS)
  # ==========================================
  - name: pass_width_10p0
    shapes:
      GR:
        - [0.0, 0.0, 10.0, 30.0]
      CO:
        - [1.5, 1.0, 8.5, 2.0]       # 幅 7.0 (左右マージン 1.5)
        - [1.5, 28.0, 8.5, 29.0]
    expected_violations: 0

  # ==========================================
  # 異常系①：幅 3.95 (0.05不足でFAIL) -> 違反数: 2
  # ==========================================
  - name: fail_wmin_3p95
    shapes:
      GR:
        - [0.0, 0.0, 3.95, 30.0]
      CO:
        - [1.5, 1.0, 2.45, 2.0]      # 左右マージン 1.5 (3.95 - 2.45 = 1.5)
        - [1.5, 28.0, 2.45, 29.0]
    expected_violations: 2

  # ==========================================
  # 異常系②：幅 20.05 (0.05超過でFAIL) -> 違反数: 2
  # ==========================================
  - name: fail_wmax_20p05
    shapes:
      GR:
        - [0.0, 0.0, 20.05, 30.0]
      CO:
        - [1.5, 1.0, 18.55, 2.0]     # 左右マージン 1.5 (20.05 - 18.55 = 1.5)
        - [1.5, 28.0, 18.55, 29.0]
    expected_violations: 2