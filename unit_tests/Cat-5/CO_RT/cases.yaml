rule_id: CO.RT

layers:
  GR: { number: 8, datatype: 2 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - GR.W1
  - GR.L1
  - GR.S1
  - GR.AP
  - GR.AN
  - RS.SZ
  - RS.RT
  - GC.GR
  - GA.CO
  - GA.BG
  - CL.GC
  - CO.W1
  - CO.S1
  - CO.GR
  - CO.GS
  - CO.Z1
  - CO.Z3
  - "[EXT] Invalid RS. Check CO spacing and enclosure."
  - "[EXT] merged CO error. Only one merged CO per RS terminal allowed. Use minimum CO space."
  - "[EXT] can not extract RS if GR enclosure of merged CO > 2.0"

cases:
  # ==========================================
  # 正常系：矩形（長方形）CO (PASS)
  # ==========================================
  - name: pass_rect
    shapes:
      GR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.5, 1.0, 2.5, 2.0]
        - [1.5, 28.0, 2.5, 29.0]
    expected_violations: 0

  # ==========================================
  # 異常系：非矩形（L字型結合CO） (FAIL) -> 違反数: 1
  # ==========================================
  - name: fail_non_rect
    shapes:
      GR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.5, 1.0, 2.5, 2.0]       # 下部
        - [2.0, 2.0, 2.5, 2.5]       # 右上に結合（L字型非矩形）
        - [1.5, 28.0, 2.5, 29.0]
    expected_violations: 1