rule_id: CC.W1

layers:
  WN: { number: 140, datatype: 0 }
  AN: { number: 3, datatype: 2 }
  AC: { number: 3, datatype: 4 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - WN.W1
  - WN.S1
  - WN.Z1
  - AC.W1
  - AC.S1
  - AC.AN
  - AC.GC
  - AC.R1
  - AN.W1
  - AN.S1
  - CC.AC
  - CC.AN
  - CO.SC
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - GA.CO
  - GA.BG
  - CL.GC
  - Warning

cases:
  # ==========================================
  # 正常系：1.20 x 1.20 固定寸法 (PASS)
  # ==========================================
  - name: pass_wfix_1p20
    shapes:
      WN:
        - [-5.0, -5.0, 35.0, 35.0]
      AN:
        - [0.0, 0.0, 30.0, 30.0]
      AC:
        - [5.0, 5.0, 15.0, 25.0]
      CO:
        - [8.0, 8.0, 9.2, 9.2]       # 1.20 x 1.20 (AC上)
        - [20.0, 8.0, 21.2, 9.2]     # 1.20 x 1.20 (AN上)
    expected_violations: 0

  # ==========================================
  # 異常系①：幅 1.15 (0.05不足でFAIL) -> 違反数: 2 (Wfix + bbox_min)
  # ==========================================
  - name: fail_wfix_1p15_single
    shapes:
      WN:
        - [-5.0, -5.0, 35.0, 35.0]
      AN:
        - [0.0, 0.0, 30.0, 30.0]
      AC:
        - [5.0, 5.0, 15.0, 25.0]
      CO:
        - [8.0, 8.0, 9.15, 9.2]      # 1.15 x 1.20
        - [20.0, 8.0, 21.2, 9.2]
    expected_violations: 2

  # ==========================================
  # 異常系②：幅 1.25 (0.05超過でFAIL) -> 違反数: 1 (bbox_max のみ)
  # ==========================================
  - name: fail_wfix_1p25_single
    shapes:
      WN:
        - [-5.0, -5.0, 35.0, 35.0]
      AN:
        - [0.0, 0.0, 30.0, 30.0]
      AC:
        - [5.0, 5.0, 15.0, 25.0]
      CO:
        - [8.0, 8.0, 9.25, 9.2]      # 1.25 x 1.20
        - [20.0, 8.0, 21.2, 9.2]
    expected_violations: 1