rule_id: AR.XY

layers:
  AR: { number: 3, datatype: 3 }

allow_other_rules: false
waive_rule_ids:
  - AR.GC
  - AR.L1
  - AR.S1
  - AR.W1
  - GC.R1
  - RR.SZ
  - "[EXT] Invalid RR. Check CO enclosure."

cases:
  # ==========================================
  # 正常系：角の縦横カット 1.0 x 1.0 (XYmin 1.0 適合) -> PASS
  # cut: 1.0 の場合、角の三角形の面積は (1.0 * 1.0) / 2 = 0.50 (>= 0.50)
  # ==========================================
  - name: pass_cut_1p0_1p0
    shapes:
      AR:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 1.0
    expected_violations: 0

  # ==========================================
  # 異常系①：カットなし 0.0 x 0.0 (通常の四角形) -> 4コーナー違反 (違反数: 4)
  # ==========================================
  - name: fail_cut_0p0_0p0
    shapes:
      AR:
        - [0.0, 0.0, 10.0, 10.0]
    expected_violations: 4

  # ==========================================
  # 異常系②：カット不足 0.5 x 0.5 (カット面積 0.125 < 0.50) -> 4コーナー違反 (違反数: 4)
  # ==========================================
  - name: fail_cut_0p5_0p5
    shapes:
      AR:
        - type: octagon
          box: [0.0, 0.0, 10.0, 10.0]
          cut: 0.5
    expected_violations: 4