rule_id: CR.ASW

layers:
  AR: { number: 3, datatype: 3 }
  CO: { number: 11, datatype: 0 }
  WN: { number: 140, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - WN.W1
  - WN.S1
  - WN.Z1
  - AR.W1
  - AR.L1
  - AR.S1
  - AR.WR
  - AR.GC
  - AR.XY
  - RR.SZ
  - RR.RT
  - GC.R1
  - GA.CO
  - GA.BG
  - CL.GC
  - CR.W1
  - CR.W2
  - CR.W3
  - CR.AR
  - CR.AT
  - CR.ASN
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - "[EXT] Invalid RR. Check CO enclosure."
  - "[EXT] Only one CO per RR terminal allowed."
  - "[EXT] can not extract RR if AR enclosure of CO > 2.0"

cases:
  # ==========================================
  # 正常系：左右マージン 1.20 固定 (PASS)
  # ==========================================
  - name: pass_margin_1p20
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]      # RRW (幅4.0)
      CO:
        - [1.20, 1.5, 2.80, 2.5]     # 左右マージン 1.20 (4.0 - 2.80 = 1.20)
        - [1.20, 27.5, 2.80, 28.5]
    expected_violations: 0

  # ==========================================
  # 異常系①：左 1.20 (正常) / 右 1.15 (0.05不足) -> 違反数: 1
  # ==========================================
  - name: fail_margin_1p15_single_edge
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.20, 1.5, 2.85, 2.5]     # 下端CO: 左1.20(OK) / 右1.15(NG: 1エッジ)
        - [1.20, 27.5, 2.80, 28.5]   # 上端CO: 左右1.20(OK)
    expected_violations: 1

  # ==========================================
  # 異常系②：左 1.20 (正常) / 右 1.25 (0.05超過) -> 違反数: 1
  # ==========================================
  - name: fail_margin_1p25_single_edge
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.20, 1.5, 2.75, 2.5]     # 下端CO: 左1.20(OK) / 右1.25(NG: 1エッジ)
        - [1.20, 27.5, 2.80, 28.5]   # 上端CO: 左右1.20(OK)
    expected_violations: 1

  # ==========================================
  # 異常系③：上下両方のCOで右側のみ 1.15 -> 違反数: 2
  # ==========================================
  - name: fail_margin_1p15_double_edge
    shapes:
      WN:
        - [-10.0, -10.0, 20.0, 40.0]
      AR:
        - [0.0, 0.0, 4.0, 30.0]
      CO:
        - [1.20, 1.5, 2.85, 2.5]     # 下端CO: 右1.15(NG)
        - [1.20, 27.5, 2.85, 28.5]   # 上端CO: 右1.15(NG)
    expected_violations: 2