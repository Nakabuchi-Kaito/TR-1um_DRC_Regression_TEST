rule_id: CC.AN

layers:
  WN: { number: 140, datatype: 0 }
  AN: { number: 3, datatype: 2 }
  AC: { number: 3, datatype: 4 }
  CO: { number: 11, datatype: 0 }

allow_other_rules: false
waive_rule_ids:
  - WN.W1
  - WN.S1
  - WN.Z1
  - AC.W1
  - AC.S1
  - AC.AN
  - AC.GC
  - AC.R1
  - AN.W1
  - AN.S1
  - CC.W1
  - CC.AC
  - CO.SC
  - CO.W1
  - CO.S1
  - CO.Z1
  - CO.Z3
  - GA.CO
  - GA.BG
  - CL.GC
  - Warning

cases:
  # ==========================================
  # 正常系：AN内包マージン 1.20 (PASS)
  # ==========================================
  - name: pass_margin_1p20
    shapes:
      WN:
        - [-5.0, -5.0, 40.0, 35.0]
      AN:
        - [0.0, 0.0, 35.0, 30.0]
      AC:
        - [5.0, 5.0, 20.0, 25.0]
      CO:
        - [32.60, 8.0, 33.80, 9.20]  # AN右端(35.0)から 35.0 - 33.80 = 1.20
    expected_violations: 0

  # ==========================================
  # 異常系①：右側マージン 1.15 (0.05不足でFAIL) -> 違反数: 1
  # ==========================================
  - name: fail_margin_1p15_single
    shapes:
      WN:
        - [-5.0, -5.0, 40.0, 35.0]
      AN:
        - [0.0, 0.0, 35.0, 30.0]
      AC:
        - [5.0, 5.0, 20.0, 25.0]
      CO:
        - [32.65, 8.0, 33.85, 9.20]  # AN右端(35.0)から 35.0 - 33.85 = 1.15
    expected_violations: 1

  # ==========================================
  # 異常系②：2個のCOでマージン 1.15 -> 違反数: 2
  # ==========================================
  - name: fail_margin_1p15_double
    shapes:
      WN:
        - [-5.0, -5.0, 40.0, 35.0]
      AN:
        - [0.0, 0.0, 35.0, 30.0]
      AC:
        - [5.0, 5.0, 20.0, 25.0]
      CO:
        - [32.65, 8.0, 33.85, 9.20]  # 1個目 (右側 1.15)
        - [32.65, 20.0, 33.85, 21.20] # 2個目 (右側 1.15)
    expected_violations: 2